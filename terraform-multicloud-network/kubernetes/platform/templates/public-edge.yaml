{{- $host := required "host is required" .Values.host -}}
{{- if eq .Values.cloud "gcp" }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public
  namespace: edge
spec:
  gatewayClassName: gke-l7-regional-external-managed
  listeners:
    - name: https
      hostname: {{ $host | quote }}
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: {{ .Values.tlsSecretName }}
      allowedRoutes:
        namespaces: {from: Same}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gateway
  namespace: edge
spec:
  parentRefs:
    - name: public
  hostnames: [{{ $host | quote }}]
  rules:
    - backendRefs:
        - name: gateway
          port: 80
---
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: gateway
  namespace: edge
spec:
  default:
    config:
      type: HTTP
      httpHealthCheck:
        port: 8000
        requestPath: /ping
  targetRef:
    group: ""
    kind: Service
    name: gateway
{{- else }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: public
  namespace: edge
  annotations:
    {{- if eq .Values.cloud "aws" }}
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/certificate-arn: {{ required "aws.certificateArn is required" .Values.aws.certificateArn | quote }}
    alb.ingress.kubernetes.io/security-groups: {{ required "aws.securityGroupId is required" .Values.aws.securityGroupId | quote }}
    alb.ingress.kubernetes.io/manage-backend-security-group-rules: "false"
    alb.ingress.kubernetes.io/healthcheck-path: /ping
    alb.ingress.kubernetes.io/healthcheck-port: "8000"
    {{- else }}
    appgw.ingress.kubernetes.io/health-probe-path: /ping
    appgw.ingress.kubernetes.io/health-probe-port: "8000"
    {{- end }}
spec:
  ingressClassName: {{ if eq .Values.cloud "aws" }}alb{{ else }}azure-application-gateway{{ end }}
  {{- if eq .Values.cloud "azure" }}
  tls:
    - hosts: [{{ $host | quote }}]
      secretName: {{ .Values.tlsSecretName }}
  {{- end }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway
                port: {number: 80}
{{- end }}
